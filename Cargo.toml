[package]
name = "forgedesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Rust desktop workspace for local coding assistants"
publish = false

[[bin]]
name = "codex-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.0", features = ["persistence"] }
egui_commonmark = { version = "=0.22.0", default-features = false, features = ["pulldown_cmark"] }
image = { version = "0.25", default-features = false, features = ["png"] }
latex-rust = { version = "=2.1.1", features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
