[package]
name = "forgedesk"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native Rust desktop workspace for local coding assistants"
publish = false

[[bin]]
name = "codex-rust"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.33.0", features = ["persistence"] }
egui_commonmark = { version = "=0.22.0", default-features = false, features = ["pulldown_cmark", "load-images", "fetch", "embedded_image"] }
egui_extras = { version = "=0.33.3", default-features = false, features = ["file", "http", "image", "gif", "webp"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
base64 = "0.22"
url = "2"
open = "5"
dirs = "6"
latex-rust = { version = "=2.1.1", features = ["png"] }
pulldown-cmark = { version = "=0.13.6", default-features = false }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
